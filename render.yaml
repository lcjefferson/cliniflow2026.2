services:
  - type: web
    name: clinicflow
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        value: ""
      - key: DB_NAME
        value: "clinicflow"
      - key: JWT_SECRET_KEY
        value: ""
      - key: CORS_ORIGINS
        value: "*"

  - type: static_site
    name: cliniflow-frontend
    rootDir: frontend
    buildCommand: yarn && yarn build
    publishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: "https://clinicflow.onrender.com"
