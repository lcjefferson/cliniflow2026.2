services:
  - type: web
    name: clinicflow
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        fromSecret: MONGO_URL_SECRET
      - key: DB_NAME
        value: "clinicflow"
      - key: ALLOWED_ORIGINS
        value: "https://cliniflow-frontend.onrender.com,http://localhost:3000"

  - type: web
    name: cliniflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn && yarn build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: "https://clinicflow-lucj.onrender.com"
      - key: NODE_VERSION
        value: "22.16.0"
