name: Update Version on Push

on:
  push:
    branches:
      - '**'

jobs:
  update-version:
    # Avoid loops: skip if commit message contains [skip ci] or if actor is the bot
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate version file
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
          mkdir -p backend
          echo "{\"version\": \"${BRANCH}-${SHORT_SHA}\", \"commit\": \"${GITHUB_SHA}\", \"date\": \"${DATE}\"}" > backend/version.json

      - name: Commit version file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/version.json
          # Avoid infinite loops by using [skip ci]
          git commit -m "[skip ci] chore: update version"
          git push
